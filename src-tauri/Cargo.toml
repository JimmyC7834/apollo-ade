[package]
name = "tauri-ade-prototype"
version = "0.1.0"
description = "Tauri ADE vertical-slice prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_ade_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what gates multiple webviews in one window: `Window::add_child`,
# `WebviewBuilder` and `Manager::get_webview` are all behind it. A browser tab is
# a child webview (ADR 0004), so the feature is not optional for this app. It is
# an API-stability flag, not an experiment switch — the surface may be renamed in
# a future minor, and `browser.rs` is the only file that touches it.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
futures-util = { version = "0.3.33", default-features = false }
# Only what the provider proxy needs: a streaming body and TLS. `rustls` avoids
# depending on the platform TLS stack, which keeps the build the same everywhere.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2"] }
# The explorer's delete, which ticket 29 asked to be recoverable rather than
# merely confirmed. Neither Tauri nor its fs plugin offers a trash, and the only
# alternative is `remove_dir_all` — one mis-click away from unrecoverable, in an
# app whose standing rule is that destructive operations are gated.
trash = "5.2.6"
# Ticket 11's route D: rtk is fetched, and a fetched binary is only as
# trustworthy as the digest it is checked against. `sha2` is that check.
sha2 = "0.10"

# Unpacking the rtk release, which ships an archive rather than a bare binary.
# Split by platform because the archive format is: upstream builds a zip for
# Windows and a gzipped tar everywhere else, so neither dependency needs to
# exist on the other side.
[target.'cfg(windows)'.dependencies.zip]
version = "6"
default-features = false
features = ["deflate"]

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

# Job objects, so aborting a command kills everything it started. Enumeration
# cannot do it: Git Bash's fork emulation orphans grandchildren, leaving them
# with a dangling parent id before any tree walk can reach them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
