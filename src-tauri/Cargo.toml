[package]
name = "tauri-ade-prototype"
version = "0.1.0"
description = "Tauri ADE vertical-slice prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_ade_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
